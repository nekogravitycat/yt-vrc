services:
  yt-vrc:
    build:
      context: .
      args:
        VERSION: ${VERSION:-docker}
    image: yt-vrc:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - yt-vrc-data:/data
    env_file:
      - .env
    environment:
      LISTEN_ADDR: ":8080"
      DATA_DIR: "/data"
      YTDLP_MODE: "managed"
      YTDLP_JS_RUNTIMES: "node"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN in .env}
      DISCORD_USER_ID: ${DISCORD_USER_ID:?set DISCORD_USER_ID in .env}
    cpus: "2.0"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yt-vrc-data:
